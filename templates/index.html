<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F8F8">
<title>SUSU Real Estate AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap">
<style>
:root{--bg:#F8F8F8;--side:#F7F7F7;--card:#fff;--comp:#FCFCFC;--fg:#1A1A1A;--mut:#8A8A8A;--bd:#E4E4E4;--soft:#EFEFEF;--ink:#2B2B2B;--acc:#1F7A5A;--bad:#C0503A;--serif:"EB Garamond","Iowan Old Style",Georgia,serif}
:root[data-theme=dark]{--bg:#141414;--side:#1A1A1A;--card:#1E1E1E;--comp:#1B1B1B;--fg:#EDEDED;--mut:#8F8F8F;--bd:#2D2D2D;--soft:#262626;--ink:#EDEDED;--acc:#5BC49B;--bad:#E58A74}
body[data-mode=property]{--acc:#2A7A44}body[data-mode=combine]{--acc:#1F7A78}
:root[data-theme=dark] body[data-mode=property]{--acc:#7BC98F}:root[data-theme=dark] body[data-mode=combine]{--acc:#5CC5C2}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:2px;padding:12px 14px 6px}
.ib{background:none;border:0;width:40px;height:40px;border-radius:12px;cursor:pointer;display:grid;place-items:center;flex:none}.ib:hover{background:var(--soft)}
.ttl{background:none;border:0;display:flex;align-items:center;gap:2px;font-weight:600;font-size:15.5px;cursor:pointer;margin-left:4px;padding:6px;border-radius:10px;white-space:nowrap}.ttl svg{width:16px;height:16px}
.st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);white-space:nowrap}.st::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--mut)}.st.live{color:var(--acc)}.st.live::before{background:var(--acc)}
main{flex:1;overflow-y:auto;padding:8px 18px 24px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:440px;margin:10vh auto 0}
.mark,.logo{background:#2B2B2B;color:#fff;display:grid;place-items:center;font:500 40px/1 var(--serif)}.mark{width:72px;height:72px;border-radius:20px}
.hero h2{font:400 38px/1.15 var(--serif);margin:22px 0 22px}
.sg{display:grid;gap:8px;width:100%}.sg button{background:none;border:1px solid var(--bd);border-radius:14px;padding:11px 14px;color:var(--mut);cursor:pointer;text-align:left;transition:.2s}.sg button:hover{color:var(--fg);background:var(--soft)}
.turn{margin:22px 0}.u{margin-left:auto;width:fit-content;max-width:86%;background:var(--soft);padding:10px 16px;border-radius:18px 18px 4px 18px}
.ai{margin-top:14px}.ai>p{margin:0 0 10px}.note{font-size:12.5px;color:var(--mut);border-left:2px solid var(--bd);padding-left:10px;margin:0 0 8px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));margin-top:14px}.grid.m{grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.num{font:500 32px/1 var(--serif);color:var(--acc)}.num small{font:12.5px system-ui,sans-serif;color:var(--mut);margin-left:3px}
h3{margin:0;font:500 22px/1.2 var(--serif)}.card p{margin:0}.mut{color:var(--mut)}.sm{font-size:12.5px}.ok{color:var(--acc)}
dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}dt{font-size:12px;color:var(--mut)}dd{margin:0;font-weight:500}
.ph,.card img{width:100%;aspect-ratio:16/9;border-radius:12px}.card img{object-fit:cover;background:var(--soft)}.ph{display:grid;place-items:center;color:var(--mut);background:var(--soft)}.ph svg{width:30px;height:30px}
.price{font:500 30px/1 var(--serif);color:var(--acc)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:14px;border-top:1px solid var(--bd)}.foot>div{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;text-align:center;text-decoration:none;cursor:pointer;border-radius:12px;padding:9px 16px;font-weight:500;font-size:14px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:.2s}
.btn.o,.btn.g{background:none;color:var(--fg);border-color:var(--bd)}.btn.o:hover,.btn.g:hover{background:var(--soft)}.btn.d{background:none;border-color:transparent;color:var(--bad)}.btn.w{width:100%;margin-top:8px}
details{font-size:13px}summary{cursor:pointer;color:var(--acc);font-weight:500}
.rs{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:12px}.rs li{display:grid;grid-template-columns:1fr auto;gap:3px 8px}.rs small{display:block;color:var(--mut);font-size:12px}
.rs i{grid-column:1/-1;height:3px;border-radius:3px;background:var(--soft);position:relative;overflow:hidden}.rs i::after{content:'';position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--acc)}
.pair{display:grid;grid-template-columns:1fr 24px 1fr;gap:12px;align-items:start}.pair>div{display:grid;gap:3px;font-size:14px}.pair b{font:500 19px/1.25 var(--serif)}.pair .ar{color:var(--mut);align-self:center}
.cr{list-style:none;padding:0;margin:0;display:grid;gap:5px;font-size:13.5px}.cr em{font-style:normal;display:inline-block;width:18px;font-weight:700}
.s-match{color:var(--acc)}.s-miss{color:var(--bad)}.s-close{color:#B08A3E}.s-unknown{color:var(--mut)}
.composer{padding:8px 16px calc(14px + env(safe-area-inset-bottom,0));max-width:820px;width:100%;margin:0 auto}
form{background:var(--comp);border:1px solid var(--bd);border-radius:24px;padding:14px 14px 10px 18px;transition:border-color .2s}form:focus-within{border-color:var(--mut)}
textarea{width:100%;border:0;outline:0;background:none;resize:none;max-height:140px;min-height:44px;padding:0;font-size:16px}textarea::placeholder{color:var(--mut)}
.fr{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.mp{display:flex;align-items:center;gap:7px;background:var(--soft);border:0;border-radius:99px;padding:7px 13px 7px 10px;font-size:13px;cursor:pointer}.mp svg{width:16px;height:16px}
.send{width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);color:var(--mut);display:grid;place-items:center;cursor:pointer;transition:.2s}.send.on{background:var(--ink);color:var(--bg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.scrim{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:opacity .28s;z-index:15}body.menu .scrim{opacity:1;pointer-events:auto}
#side{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--side);border-right:1px solid var(--bd);transform:translateX(-102%);transition:transform .28s ease;z-index:20;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0)) 14px calc(12px + env(safe-area-inset-bottom,0))}body.menu #side{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:0 2px}.logo{width:34px;height:34px;border-radius:9px;font-size:21px}
.mcard{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:6px;display:grid;gap:2px;margin-bottom:12px}
.mcard button,.nav{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-radius:12px;padding:12px;font-size:16px;cursor:pointer;text-align:left}
.mcard button.on,.nav.on,.nav:hover{background:var(--soft)}.nav .pl{width:30px;height:30px;margin:-3px 0;border-radius:50%;background:var(--soft);display:grid;place-items:center}.nav .pl svg{width:16px;height:16px}
.hist{flex:1;overflow-y:auto;margin:4px -6px 0;padding:0 6px}.gl{font-size:13px;color:var(--mut);margin:16px 12px 6px}
.hi{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;cursor:pointer}.hi:hover{background:var(--soft)}.hi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;padding:0 4px}.sf{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.kp{max-width:560px;margin:8px auto 0}.kt{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:8px}.kt h2{font:400 34px/1.1 var(--serif);margin:4px 0 8px}.kt p{margin:0}
.fab{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none}
.empty{text-align:center;padding:44px 20px;border:1px dashed var(--bd);border-radius:18px;margin-top:16px;display:grid;gap:10px;justify-items:center}.empty p{margin:0;font:400 26px var(--serif)}
.key{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:16px;margin:14px 0;display:grid;gap:10px}
.kh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.kh b{font:500 22px/1.2 var(--serif)}.kh small{display:block;color:var(--mut);font-size:12.5px}.key p{margin:0}
.mask{font:12.5px ui-monospace,Menlo,monospace;letter-spacing:.06em}.kr{display:flex;gap:8px}.msg{font-size:12.5px;min-height:1em}.msg.ok{color:var(--acc)}.msg.bad{color:var(--bad)}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--bd);border:0;cursor:pointer;transition:.2s;flex:none}.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.2s}.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px)}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:30}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0))}.panel h3{font-size:28px;margin:0 0 6px}.panel>p{margin:0 0 16px}
input.k{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin:0 0 14px;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.seg button{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:500}.seg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.seg small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--mut)}.tag.ai{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}.tag.search{background:color-mix(in srgb,#B08A3E 18%,transparent);color:#9A7430}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:28px 0 -4px}.gh h4{margin:0;font:500 22px var(--serif)}.seg .gl2{grid-column:1/-1;font-size:12.5px;color:var(--mut);margin-top:2px}
.dots::after{content:'';animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}
@media(max-width:480px){.pair{grid-template-columns:1fr}.pair .ar{transform:rotate(90deg);justify-self:start}.hero h2{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body data-mode="lead"><div id="app">
<header><button class="ib" id="menu" aria-label="Open menu"></button><button class="ib" id="new" aria-label="New chat"></button>
<button class="ttl" id="ttl"><span id="tt">SUSU Real Estate AI</span><span id="chev"></span></button><span class="st" id="pill">Demo mode</span></header>
<main id="feed"></main>
<footer class="composer" id="comp"><form id="f"><textarea id="q" rows="2"></textarea>
<div class="fr"><button type="button" class="mp" id="mp"><span id="mi"></span><span id="ml"></span></button><button class="send" id="sd" aria-label="Send"></button></div></form></footer>
</div>
<div class="scrim" id="scrim"></div><aside id="side"></aside>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<script>
const $=s=>document.querySelector(s),LS=localStorage;
const KEYS={lead:'leadFinderHistory',property:'propertyFinderHistory',combine:'combineHistory',chat:'chatHistory'};
const rd=k=>{try{const v=JSON.parse(LS.getItem(k));return Array.isArray(v)?v:[]}catch(e){return[]}};
const H={};for(const k in KEYS)H[k]=rd(KEYS[k]);
const wr=k=>{try{LS.setItem(KEYS[k],JSON.stringify(H[k]))}catch(e){}};
let mode=LS.getItem('susuMode')||'lead',view='chat',fresh=true,cfg={live:false},busy=false,K=[],PV=[],USING={},kerr='',draft={name:'',provider:'tavily',model:''};
if(!['lead','property','combine'].includes(mode))mode='lead';
const P={menu:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/>',chev:'<path d="M6 9l6 6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',up:'<path d="M12 19V5M5 12l7-7 7 7"/>',lead:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',property:'<path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5"/>',combine:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l3 3"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isUrl=u=>/^https?:\/\//i.test(u||''),safe=u=>isUrl(u)?esc(u):'#';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const naira=n=>n?'₦'+Number(n).toLocaleString('en-NG'):'';
const hrs=iso=>{const t=Date.parse(iso);return iso&&!isNaN(t)?(Date.now()-t)/36e5:null};
const ago=h=>h<1?Math.max(1,Math.round(h*60))+' min ago':h<24?Math.round(h)+' hours ago':Math.round(h/24)+' days ago';
const tag=h=>h<=10?'Very recent':h<=24?'Recent':h<=72?'Older':'Low priority';
const posted=iso=>{const h=hrs(iso);return h==null?'Posting date unavailable':`Posted ${ago(h)} · ${tag(h)}`};
const facts=a=>{a=a.filter(x=>x[1]);return a.length?`<dl>${a.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`:''};
const miss=m=>m&&m.length?` · Missing: ${esc(m.join(', ').replace(/_/g,' '))}`:'';
const open=(u,t='Open original')=>isUrl(u)?`<a class="btn o" href="${safe(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`:'<span class="mut sm">No source link</span>';
const contact=i=>`<p class="sm">Contact: ${i.contact?esc(i.contact):'<span class="mut">Contact unavailable</span>'}</p>`;
const C={
lead:l=>`<article class="card"><div class="top"><span class="mut sm">${esc(l.name||'Name unavailable')}</span><span class="num">${l.score}<small>/100</small></span></div>
<h3>${esc(l.request)}</h3>${facts([['Location',l.location],['Budget',naira(l.budget)],['Type',l.type],['Bedrooms',l.bedrooms]])}
<p class="sm mut">${posted(l.posted_at)}</p>${contact(l)}
<details><summary>Why this score</summary><ul class="rs">${(l.reasons||[]).map(r=>`<li><span>${esc(r.label)}<small>${esc(r.note)}</small></span><span class="mut">${r.pts}/${r.max}</span><i style="--w:${r.max?r.pts/r.max*100:0}%"></i></li>`).join('')}</ul></details>
<div class="foot"><span class="mut sm">${esc(l.source||'Unknown source')}${miss(l.missing)}</span>${open(l.url)}</div></article>`,
property:p=>`<article class="card">${p.image&&isUrl(p.image)?`<img loading="lazy" src="${safe(p.image)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph'}))">`:`<div class="ph">${ic('property')}</div>`}
<h3>${esc(p.title)}</h3><div class="price">${p.price?naira(p.price):'<span class="mut" style="font:14px system-ui">Price not stated</span>'}</div>
${p.description?`<p class="sm mut">${esc(p.description)}</p>`:''}${facts([['Location',p.location],['Type',p.type],['Bedrooms',p.bedrooms]])}
<p class="sm mut">${posted(p.posted_at)}</p>${contact(p)}
<div class="foot"><span class="mut sm">${esc(p.source||'Unknown source')}${miss(p.missing)}</span>${open(p.url,'View original listing')}</div></article>`,
combine:m=>{const l=m.lead,p=m.property,I={match:'✓',miss:'✗',unknown:'?',close:'≈'},j=a=>a.filter(Boolean).map(esc).join(' · ');
return `<article class="card"><div class="top"><span class="num">${m.score}<small>% match</small></span><span class="mut sm">Confidence ${m.confidence}%</span></div>
<div class="pair"><div><span class="mut sm">Buyer</span><b>${esc(l.name||'Name unavailable')}</b><span>${esc(l.request)}</span><span class="mut sm">${j([l.location,naira(l.budget),l.bedrooms&&l.bedrooms+' bed'])}</span></div><div class="ar">${ic('arrow')}</div>
<div><span class="mut sm">Matching property</span><b>${esc(p.title)}</b><span class="mut sm">${j([p.location,naira(p.price)])}</span></div></div>
<ul class="cr">${m.criteria.map(c=>`<li><em class="s-${c.status}">${I[c.status]}</em>${esc(c.label)} <span class="mut">${esc(c.detail)}</span></li>`).join('')}</ul>
<div class="foot"><div>${open(l.url,'Open lead')}${open(p.url,'Open property')}</div></div></article>`}
};
const turn=e=>`<section class="turn" id="e${e.id}"><div class="u">${esc(e.q)}</div><div class="ai"><p>${esc(e.reply)}</p>${(e.notes||[]).map(n=>`<p class="note">${esc(n)}</p>`).join('')}<div class="grid${e.kind==='combine'?' m':''}">${(e.results||[]).map(x=>C[e.kind](x)).join('')}</div></div></section>`;
const INFO={lead:{n:'Lead Finder',t:'Who is looking to buy?',p:'Find recent buyers looking for land in Lagos',c:['Find recent buyers looking for land in Lagos','Anyone selling a house in Lekki?','Need an apartment around Wuse']},
property:{n:'Property Finder',t:'What are you looking for?',p:'Find 3 bedroom apartments in Abuja',c:['Find 3 bedroom apartments in Abuja','Find properties in Lekki under ₦20m','Land for sale in Lekki']},
combine:{n:'Combine',t:'Which buyer fits which property?',p:'Match my newest buyers with properties',c:['Match my newest buyers with properties']}};
const tagOf=k=>`<span class="tag ${k.group}">${esc(k.label)}</span><span class="tag">${k.group==='ai'?'AI model · '+esc(k.model||'default'):'Web search'}</span>`;
const keyCard=k=>`<section class="key"><div class="kh"><div><b>${esc(k.name)}</b><div class="tags">${tagOf(k)}<span class="mask">${esc(k.hint)}</span></div></div><button class="sw ${k.enabled?'on':''}" role="switch" aria-checked="${k.enabled}" aria-label="Use this key" data-id="${k.id}"></button></div>
<p class="sm ${k.enabled?'ok':'mut'}">${k.enabled?'On: this key is in use':'Off: not in use'}</p><div class="kr"><button class="btn g" data-a="test" data-id="${k.id}">Test</button><button class="btn d" data-a="remove" data-id="${k.id}">Remove</button></div><div class="msg" id="m-${k.id}"></div></section>`;
const using=g=>{const u=USING[g];return u?(u.env?`Using the ${u.label} key from .env`:`Using: ${u.label} (${u.name})`):(g==='search'?'No search key is on: demo data only':'No AI key is on: basic parsing only')};
const section=(g,t)=>`<div class="gh"><h4>${t}</h4><span class="sm ${USING[g]?'ok':'mut'}">${esc(using(g))}</span></div>`+K.filter(k=>k.group===g).map(keyCard).join('');
const keysHtml=()=>`<div class="kp"><div class="kt"><div><h2>API keys</h2><p class="mut sm">Name a key first, then choose its type and paste it. One search key and one AI key can be on at a time, and SUSU uses exactly those.</p></div><button class="fab" id="add" aria-label="Add key">${ic('plus')}</button></div>
${kerr?`<p class="note">${esc(kerr)}</p>`:''}${K.length?section('search','Search')+section('ai','AI models'):`<div class="empty"><p>No API keys</p><span class="mut sm">Create a key to switch from demo to live search.</span><button class="btn" id="add2">Create key</button></div>`}
${['search','ai'].filter(g=>USING[g]&&USING[g].env).map(g=>`<p class="note">${esc(using(g))}</p>`).join('')}</div>`;
function side(){const g={Today:[],'Previous 30 days':[],Older:[]},td=new Date().toDateString(),dark=document.documentElement.dataset.theme==='dark';
[...H[mode]].reverse().forEach(e=>(new Date(e.ts).toDateString()===td?g.Today:(Date.now()-e.ts)/864e5<=30?g['Previous 30 days']:g.Older).push(e));
const L=Object.keys(g).filter(k=>g[k].length).map(k=>`<div class="gl">${k}</div>`+g[k].map(e=>`<div class="hi" data-o="${e.id}"><span>${esc(e.q)}</span><button class="x" data-d="${e.id}" aria-label="Remove">×</button></div>`).join('')).join('');
$('#side').innerHTML=`<div class="sh"><span class="logo">S</span><button class="ib" id="sx" aria-label="Close menu">${ic('menu')}</button></div>
<div class="mcard">${Object.keys(INFO).map(k=>`<button data-m="${k}" class="${view==='chat'&&mode===k?'on':''}">${ic(k)}${INFO[k].n}</button>`).join('')}</div>
<button class="nav" id="nw"><span class="pl">${ic('plus')}</span>New chat</button><button class="nav ${view==='keys'?'on':''}" data-v="keys">${ic('key')}API keys</button>
<div class="hist">${L||'<div class="gl">No history yet</div>'}${H[mode].length?'<button class="nav sm" id="clr" style="color:var(--mut)">Clear this history</button>':''}</div>
<div class="sf"><button class="nav" id="th">${ic(dark?'sun':'moon')}${dark?'Light mode':'Dark mode'}</button></div>`}
function render(){document.body.dataset.mode=mode;try{LS.setItem('susuMode',mode)}catch(e){}
const f=$('#feed'),I=INFO[mode],kv=view==='keys';
$('#tt').textContent=kv?'API keys':'SUSU Real Estate AI';$('#ml').textContent=I.n;$('#mi').innerHTML=ic(mode);$('#q').placeholder=I.p;$('#comp').hidden=kv;
f.innerHTML=kv?keysHtml():(fresh||!H[mode].length)?`<div class="hero"><div class="mark">S</div><h2>${I.t}</h2><div class="sg">${I.c.map(c=>`<button>${esc(c)}</button>`).join('')}</div></div>`:H[mode].map(turn).join('');
f.scrollTop=kv||fresh?0:f.scrollHeight;
const p=$('#pill');p.textContent=cfg.offline?'Offline':cfg.live?'Live':'Demo mode';p.classList.toggle('live',!!cfg.live);side()}
async function api(u,body,method){let r;try{r=await fetch(u,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}catch(e){throw Error('Cannot reach the SUSU server. Is python app.py still running?')}
const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw Error(d.error||'Server error '+r.status);return d}
async function status(){try{cfg=await api('/api/config/status')}catch(e){cfg={live:false,offline:true}}render()}
async function keysCall(u,body,method){const d=await api(u,body,method);K=d.keys||[];PV=d.providers||PV;USING=d.using||{};cfg.live=d.live;kerr='';render();return d}
async function showKeys(){view='keys';menu(false);try{await keysCall('/api/keys')}catch(e){kerr=e.message;render()}}
function pick(k){const seen={},o=[];[...H[k]].reverse().forEach(e=>(e.results||[]).forEach(x=>{if(!seen[x.id]){seen[x.id]=1;o.push(x)}}));return o.slice(0,25)}
async function send(text){text=(text||'').trim();if(!text||busy)return;busy=true;view='chat';fresh=false;$('#q').value='';$('#sd').classList.remove('on');render();
H.chat.push({id:uid(),role:'user',text,ts:Date.now()});
const f=$('#feed');f.querySelector('.hero')?.remove();
f.insertAdjacentHTML('beforeend',`<section class="turn"><div class="u">${esc(text)}</div><div class="ai mut"><span id="step"></span><span class="dots"></span></div></section>`);f.scrollTop=f.scrollHeight;
const S=['Understanding your request','Searching public sources','Scoring and organising results'];let n=0;
const step=()=>{const s=$('#step');if(s)s.textContent=S[Math.min(n++,2)]};step();const tm=setInterval(step,1100);
let kind=mode;const e={id:uid(),q:text,ts:Date.now(),results:[],notes:[]};
try{const r=await api('/api/chat',{message:text});
if(r.intent==='match'){kind='combine';const m=await api('/api/match',{leads:pick('lead'),properties:pick('property')});Object.assign(e,{reply:m.reply,results:m.results,notes:m.notes||[]})}
else{kind=r.intent==='leads'?'lead':'property';Object.assign(e,{reply:r.reply,results:r.results,notes:r.notes||[]})}
}catch(err){e.reply='Something went wrong: '+err.message}
clearInterval(tm);e.kind=kind;mode=kind;H[kind].push(e);if(H[kind].length>40)H[kind].shift();
H.chat.push({id:uid(),role:'ai',text:e.reply,mode:kind,ts:Date.now()});if(H.chat.length>200)H.chat.splice(0,H.chat.length-200);
wr(kind);wr('chat');busy=false;render()}
const menu=o=>document.body.classList.toggle('menu',o);
function addSheet(step){$('#sheet').hidden=false;const P2=PV.find(p=>p.id===draft.provider)||{name:draft.provider,group:'ai',model:''};
const grp=(g,t)=>`<div class="gl2">${t}</div>`+PV.filter(p=>p.group===g).map(p=>`<button data-p="${p.id}" class="${p.id===draft.provider?'on':''}">${esc(p.name)}<small>${esc(p.about||p.model)}</small></button>`).join('');
$('#panel').innerHTML=(step===1?`<h3>Create key</h3><p class="mut sm">Name it first (for example Susu, Main or Backup), then choose what type of key it is.</p>
<input class="k" id="kn" maxlength="40" placeholder="Key name" value="${esc(draft.name)}" autocomplete="off"><div class="seg">${grp('search','Search')}${grp('ai','AI models')}</div>
<div class="msg bad" id="am"></div><button class="btn w" id="c1">Continue</button>`:
`<h3>Paste your ${esc(P2.name)} key</h3><p class="mut sm">Saving as "${esc(draft.name)}". Switching it on makes SUSU use ${esc(P2.name)} for ${P2.group==='ai'?'AI':'search'}; any other ${P2.group==='ai'?'AI':'search'} key switches off.</p>
<input class="k" id="kv" type="password" autocomplete="off" placeholder="Paste key">${P2.group==='ai'?`<input class="k" id="km" autocomplete="off" placeholder="Model (optional, default ${esc(P2.model)})" value="${esc(draft.model)}">`:''}
<div class="msg bad" id="am"></div><button class="btn w" id="c2">Save key</button><button class="btn g w" id="bk">Back</button>`)+'<button class="btn d w" id="x">Close</button>'}
$('#panel').onclick=async ev=>{const t=ev.target.closest('button');if(!t)return;
if(t.dataset.p){draft.provider=t.dataset.p;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b===t))}
else if(t.id==='c1'){const n=$('#kn').value.trim();if(!n)return $('#am').textContent='Enter a name first.';draft.name=n;addSheet(2)}
else if(t.id==='bk')addSheet(1)
else if(t.id==='c2'){const v=$('#kv').value.trim();if(!v)return $('#am').textContent='Paste the key first.';const m=$('#km')?$('#km').value.trim():'';try{await keysCall('/api/keys',{name:draft.name,provider:draft.provider,key:v,model:m});draft.name='';draft.model='';$('#sheet').hidden=true}catch(e){$('#am').textContent=e.message}}
else if(t.id==='x')$('#sheet').hidden=true};
$('#sheet').onclick=e=>{if(e.target.id==='sheet')e.target.hidden=true};
async function keyTest(id){const m=$('#m-'+id);m.textContent='Testing…';m.className='msg';try{const r=await api('/api/keys/'+id+'/test',{});m.textContent=r.message;m.className='msg '+(r.ok?'ok':'bad')}catch(e){m.textContent=e.message;m.className='msg bad'}}
$('#feed').onclick=e=>{const b=e.target.closest('button');if(!b)return;const fail=x=>{kerr=x.message;render()};
if(b.closest('.sg'))send(b.textContent);else if(b.id==='add'||b.id==='add2')addSheet(1);
else if(b.classList.contains('sw'))keysCall('/api/keys/'+b.dataset.id,{enabled:b.getAttribute('aria-checked')!=='true'},'PATCH').catch(fail);
else if(b.dataset.a==='test')keyTest(b.dataset.id);
else if(b.dataset.a==='remove'&&confirm('Remove this key? You can add it again any time.'))keysCall('/api/keys/'+b.dataset.id,null,'DELETE').catch(fail)};
$('#side').onclick=e=>{const t=e.target.closest('[data-m],[data-v],[data-o],[data-d],#nw,#th,#sx,#clr');if(!t)return;
if(t.dataset.d){H[mode]=H[mode].filter(x=>x.id!=t.dataset.d);wr(mode);render()}
else if(t.dataset.m){mode=t.dataset.m;view='chat';fresh=true;menu(false);render()}
else if(t.dataset.v)showKeys();
else if(t.dataset.o){view='chat';fresh=false;menu(false);render();document.getElementById('e'+t.dataset.o)?.scrollIntoView()}
else if(t.id==='nw'){view='chat';fresh=true;menu(false);render();$('#q').focus()}
else if(t.id==='th')setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
else if(t.id==='sx')menu(false);
else if(t.id==='clr'&&confirm('Clear all '+INFO[mode].n+' history?')){H[mode]=[];wr(mode);render()}};
const setTheme=t=>{document.documentElement.dataset.theme=t;try{LS.setItem('susuTheme',t)}catch(e){}document.querySelector('meta[name=theme-color]').content=t==='dark'?'#141414':'#F8F8F8';side()};
$('#menu').innerHTML=ic('menu');$('#new').innerHTML=ic('edit');$('#chev').innerHTML=ic('chev');$('#sd').innerHTML=ic('up');
$('#menu').onclick=$('#ttl').onclick=$('#mp').onclick=()=>menu(true);$('#scrim').onclick=()=>menu(false);
$('#new').onclick=()=>{view='chat';fresh=true;render();$('#q').focus()};
setTheme(LS.getItem('susuTheme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
const q=$('#q');q.oninput=()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,140)+'px';$('#sd').classList.toggle('on',!!q.value.trim())};
q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>700){e.preventDefault();$('#f').requestSubmit()}};
$('#f').onsubmit=e=>{e.preventDefault();const t=q.value;q.style.height='auto';send(t)};
render();status();
</script></body></html>
